server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: none
spring:
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
  application:
    name: exame-perto
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/exameperto}
    username: ${DATABASE_USER:exameperto}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB
registration:
  privacy-approved: false
  allowed-origin: http://localhost:5173
  attempts-per-minute: 5
  global-attempts-per-minute: 100
  email-token-ttl: PT30M
  recovery-token-ttl: PT30M
  session-ttl: PT15M
  refresh-ttl: P30D
  email-resend-window: PT1M
security:
  data-key: ${EXAME_PERTO_DATA_KEY:}
  search-key: ${EXAME_PERTO_SEARCH_KEY:}
  signing-key: ${EXAME_PERTO_SIGNING_KEY:}
  mfa-elevation-ttl: PT5M
email:
  enabled: ${EXAME_PERTO_EMAIL_ENABLED:false}
  from: ${EXAME_PERTO_EMAIL_FROM:}
family:
  invitation-ttl: PT48H
  maximum-grant-ttl: P90D
storage:
  private-root: ${EXAME_PERTO_PRIVATE_ROOT:${java.io.tmpdir}/exame-perto-private}
review:
  file-safety-inspection-enabled: true
payment:
  max-event-payload-bytes: 65536
tracking:
  enabled: ${EXAME_PERTO_TRACKING_ENABLED:false}
  max-age: PT2M
  future-tolerance: PT30S
  stale-after: PT60S
  rate-window: PT2M
  rate-maximum: 8
  max-payload-bytes: 1024
  low-accuracy-meters: 100
privacy:
  purge-enabled: ${EXAME_PERTO_PRIVACY_PURGE_ENABLED:false}
