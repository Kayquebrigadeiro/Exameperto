server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  forward-headers-strategy: none
spring:
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
  application:
    name: exame-perto
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/exameperto}
    username: ${DATABASE_USER:exameperto}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB
registration:
  privacy-approved: false
  allowed-origin: http://127.0.0.1:5173
  attempts-per-minute: 5
  global-attempts-per-minute: 100
  email-token-ttl: PT30M
  recovery-token-ttl: PT30M
  session-ttl: PT15M
  refresh-ttl: P30D
  email-resend-window: PT1M
security:
  data-key: ${EXAME_PERTO_DATA_KEY:}
  search-key: ${EXAME_PERTO_SEARCH_KEY:}
  signing-key: ${EXAME_PERTO_SIGNING_KEY:}
  mfa-elevation-ttl: PT5M
email:
  enabled: ${EXAME_PERTO_EMAIL_ENABLED:false}
  from: ${EXAME_PERTO_EMAIL_FROM:}
  allowed-recipients: ${EXAME_PERTO_EMAIL_ALLOWED_RECIPIENTS:}
family:
  invitation-ttl: PT48H
  maximum-grant-ttl: P90D
storage:
  private-root: ${EXAME_PERTO_PRIVATE_ROOT:${java.io.tmpdir}/exame-perto-private}
review:
  file-safety-inspection-enabled: true
payment:
  max-event-payload-bytes: 65536
  mercadopago:
    enabled: ${EXAME_PERTO_PAYMENT_ENABLED:false}
    environment: ${EXAME_PERTO_PAYMENT_ENVIRONMENT:SANDBOX}
    access-token: ${EXAME_PERTO_PAYMENT_ACCESS_TOKEN:}
    webhook-secret: ${EXAME_PERTO_PAYMENT_WEBHOOK_SECRET:}
    sandbox-payer-email: ${EXAME_PERTO_PAYMENT_SANDBOX_PAYER_EMAIL:}
    api-base-url: ${EXAME_PERTO_PAYMENT_API_BASE_URL:https://api.mercadopago.com}
    timeout: ${EXAME_PERTO_PAYMENT_TIMEOUT:PT5S}
    max-response-bytes: ${EXAME_PERTO_PAYMENT_MAX_RESPONSE_BYTES:65536}
orders:
  route:
    enabled: ${EXAME_PERTO_ROUTE_ENABLED:false}
    api-key: ${EXAME_PERTO_ROUTE_API_KEY:}
    endpoint: ${EXAME_PERTO_ROUTE_ENDPOINT:https://api.heigit.org/openrouteservice/v2/directions/driving-car}
    timeout: ${EXAME_PERTO_ROUTE_TIMEOUT:PT3S}
    max-response-bytes: ${EXAME_PERTO_ROUTE_MAX_RESPONSE_BYTES:65536}
    max-retries: ${EXAME_PERTO_ROUTE_MAX_RETRIES:1}
  geocode:
    enabled: ${EXAME_PERTO_GEOCODE_ENABLED:${EXAME_PERTO_ROUTE_ENABLED:false}}
    api-key: ${EXAME_PERTO_GEOCODE_API_KEY:${EXAME_PERTO_ROUTE_API_KEY:}}
    endpoint: ${EXAME_PERTO_GEOCODE_ENDPOINT:https://api.heigit.org/pelias/v1/search}
    timeout: ${EXAME_PERTO_GEOCODE_TIMEOUT:PT3S}
    max-response-bytes: ${EXAME_PERTO_GEOCODE_MAX_RESPONSE_BYTES:65536}
tracking:
  enabled: ${EXAME_PERTO_TRACKING_ENABLED:false}
  max-age: PT2M
  future-tolerance: PT30S
  stale-after: PT60S
  rate-window: PT2M
  rate-maximum: 8
  max-payload-bytes: 1024
  low-accuracy-meters: 100
  retention:
    enabled: ${EXAME_PERTO_TRACKING_RETENTION_ENABLED:false}
    batch-size: ${EXAME_PERTO_TRACKING_RETENTION_BATCH_SIZE:100}
    max-batches-per-run: ${EXAME_PERTO_TRACKING_RETENTION_MAX_BATCHES:10}
    queue-delay-ms: ${EXAME_PERTO_TRACKING_RETENTION_QUEUE_DELAY_MS:60000}
privacy:
  purge-enabled: ${EXAME_PERTO_PRIVACY_PURGE_ENABLED:false}
