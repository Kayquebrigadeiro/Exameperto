      - reasonCode
      description: 'RETOMAR restaura apenas previousOrderStatus persistido pelo servidor: ACEITA exige retirada
        posterior, RETIRADA exige início posterior, EM_ENTREGA retoma deslocamento. Não admite salto de retirada.
        Custo novo exige política, concordância e cobertura; caso contrário 422 POLICY_UNDEFINED. ENCERRAR requer
        resolução e remuneração apuradas. ENCERRAR após retirada requer destinationEvidenceId e returnUnitId do
        protocolo aceito: registrar devolução comprovada e encerramento de custódia; entrega ao destinatário usa
        fluxo normal de código. Persistir prova/destino antes de concluir apuração na mesma transação, sem encerramento
        parcial. Não fixar valores/multas/responsabilidades. RETOMAR não aceita esses campos. ENCERRAR requer serviceEvidenceIds;
