openapi: 3.0.3
info:
  title: Exame Perto — contrato de planejamento
  version: 0.1.0
  description: 'Proposta documental, sem servidor implementado. Autorizar cada ação por papel e registro. Integrações
    ausentes retornam 503 INTEGRATION_UNAVAILABLE; política material indefinida retorna 422 POLICY_UNDEFINED. Erros
    principais: INVALID_INPUT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, STATE_CONFLICT, FUNDING_INSUFFICIENT, IDEMPOTENCY_CONFLICT,
    ALREADY_ASSIGNED, VERSION_MISMATCH, RATE_LIMITED, LOCATION_STALE. Nomes de rotas em inglês e estados de domínio
    em português são estáveis nesta proposta. Respostas sensíveis usam Cache-Control: no-store. Listas sempre paginadas
    após escopo de autorização. Este arquivo não especifica STOMP; ver docs/SEGURANCA.md. Administração de papéis,
    políticas, instituições e habilitação de integrações depende de procedimentos ainda não definidos; nenhuma rota
    pública permite promovê-los. Replay de comando concluído exige sessão e relação histórica autorizadas; estado
    ativo é guarda só para execução inédita. Revogação de representação prevalece sobre replay. O retorno mínimo
    de replay não reabre acesso a GPS/endereço/código.'
servers:
- url: /api/v1
  description: Caminho relativo previsto; nenhum host publicado.
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      summary: Cadastrar conta básica
      tags:
      - auth
      description: Público; sem campos role/status. Resposta genérica, inclusive e-mail já existente. Sem provedor
        de e-mail real, 503.
      x-permission: Público; sem campos role/status
      responses:
        '202':
          description: Cadastrar conta básica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
  /auth/login:
    post:
      operationId: login
      summary: Autenticar
      tags:
      - auth
      description: Público; conta habilitada. WEB exige Origin permitido e recebe refresh em cookie; MOBILE recebe
        refresh no corpo. Login não ativa papéis.
      x-permission: Público; conta habilitada
      responses:
        '200':
          description: Autenticar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'WEB: refresh=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth. MOBILE não recebe
                cookie.'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotacionar sessão
      tags:
      - auth
      description: Sessão válida; WEB cookie e CSRF, MOBILE refresh no corpo. Reutilização revoga família. Resposta
        Cache-Control no-store; WEB retorna Set-Cookie, MOBILE recebe novo refresh no corpo. A alternativa vazia
        de security modela apenas MOBILE com credencial obrigatória no corpo; nunca permite refresh anônimo.
      x-permission: Sessão válida; WEB cookie e CSRF, MOBILE refresh no corpo
      responses:
        '200':
          description: Rotacionar sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'WEB: refresh=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth. MOBILE não recebe
                cookie.'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      security:
      - refreshCookie: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
  /auth/logout:
    post:
      operationId: logout
      summary: Revogar sessão atual
      tags:
      - auth
      description: Conta autenticada WEB também limpa refresh com Set-Cookie expirado; revogação no servidor é obrigatória
