openapi: 3.0.3
info:
  title: Exame Perto — contrato de planejamento
  version: 0.4.0
  description: 'Autenticação e autorização familiar implementadas nos tickets 03–04; demais operações permanecem planejamento. Autorizar cada ação por papel e registro. Integrações
    ausentes retornam 503 INTEGRATION_UNAVAILABLE; política material indefinida retorna 422 POLICY_UNDEFINED. Erros
    principais: INVALID_INPUT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, STATE_CONFLICT, FUNDING_INSUFFICIENT, IDEMPOTENCY_CONFLICT,
    ALREADY_ASSIGNED, VERSION_MISMATCH, RATE_LIMITED, LOCATION_STALE. Nomes de rotas em inglês e estados de domínio
    em português são estáveis nesta proposta. Respostas sensíveis usam Cache-Control: no-store. Listas sempre paginadas
    após escopo de autorização. Este arquivo não especifica STOMP; ver docs/SEGURANCA.md. Administração de papéis,
    políticas, instituições e habilitação de integrações depende de procedimentos ainda não definidos; nenhuma rota
    pública permite promovê-los. Replay de comando concluído exige sessão e relação histórica autorizadas; estado
    ativo é guarda só para execução inédita. Revogação de representação prevalece sobre replay. O retorno mínimo
    de replay não reabre acesso a GPS/endereço/código. D01–D12 adotadas em 30/09/2026: arquitetura não habilita
    políticas ou integrações. Cadastro/segurança e particular independem de programa subsidiado. AD/AO/AB/GF exigem
    MFA validado no servidor (403 MFA_REQUIRED), sem bootstrap padrão. Nenhuma unidade ou financiador confirmado;
    biometria adiada. Primeiro marco funcional local, sem piloto presumido.'
servers:
- url: /api/v1
  description: Caminho relativo previsto; nenhum host publicado.
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      summary: Cadastrar conta básica
      tags:
      - auth
      description: Público; sem campos role/status. Resposta genérica, inclusive e-mail já existente. Sem provedor
        de e-mail real, 503. Sem e-mail habilitado não persistir conta/desafio/outbox de envio, nem retornar 202
        ou token. 03A preserva essa indisponibilidade; 03 implementa cadastro pendente e confirmação. Responsáveis e retenção
        validados são necessários para dados reais (422).
      x-permission: Público; sem campos role/status
      responses:
        '202':
          description: Cadastrar conta básica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
  /auth/login:
    post:
      operationId: login
      summary: Autenticar
      tags:
      - auth
      description: Público; conta habilitada. WEB exige Origin permitido e recebe refresh em cookie; MOBILE recebe
        refresh no corpo. Login não ativa papéis.
      x-permission: Público; conta habilitada
      responses:
        '200':
          description: Autenticar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'WEB: refresh=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth. MOBILE não recebe
                cookie.'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotacionar sessão
      tags:
      - auth
      description: Sessão válida; WEB cookie e CSRF, MOBILE refresh no corpo. Reutilização revoga família, inclusive sob concorrência. Validade absoluta padrão de 30 dias sem extensão pela rotação. Resposta
        Cache-Control no-store; WEB retorna Set-Cookie, MOBILE recebe novo refresh no corpo. A alternativa vazia
        de security modela apenas MOBILE com credencial obrigatória no corpo; nunca permite refresh anônimo.
      x-permission: Sessão válida; WEB cookie e CSRF, MOBILE refresh no corpo
      responses:
        '200':
          description: Rotacionar sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'WEB: refresh=...; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth. MOBILE não recebe
                cookie.'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Csrf'
      security:
      - refreshCookie: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
  /auth/logout:
    post:
      operationId: logout
      summary: Revogar sessão atual
      tags:
      - auth
      description: Revoga a família atual, incluindo sucessor concorrente. Conta autenticada WEB também limpa refresh com Set-Cookie expirado; revogação no servidor é obrigatória
        mesmo se apagar o cookie falhar.
      x-permission: Conta autenticada
      responses:
        '204':
          description: Revogar sessão atual
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/Csrf'
  /auth/verification:
    post:
      operationId: verifyEmail
      summary: Confirmar e-mail
      tags:
      - auth
      description: Token aleatório de 256 bits, uso único e prazo padrão de 30 minutos. Confirma somente o e-mail; não verifica identidade, elegibilidade ou entregador.
      x-permission: Token de desafio de uso único
      responses:
        '200':
          description: Confirmar e-mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeInput'
  /auth/verification/resend:
    post:
      operationId: resendVerification
      summary: Solicitar novo código de confirmação
      tags: [auth]
      security: []
      x-permission: Público; resposta genérica, sem revelar existência
      description: 202 PENDENTE não confirma envio. Intervalo mínimo por conta de um minuto; pedido durante o intervalo tem a mesma resposta sem novo envio. Ausência de configuração retorna 503; falha posterior fica RECONCILIAR na fila interna. Novo desafio invalida o anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          description: Solicitação recebida, sem confirmação de envio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /auth/csrf:
    get:
      operationId: getCsrf
      summary: Obter token CSRF para cliente web
      tags:
      - auth
      description: 'WEB: Origin permitido e cookie refresh obrigatório; token HMAC ligado ao refresh. Resposta no-store. POST oferece a mesma leitura para navegadores same-origin que omitem Origin no GET.'
      x-permission: 'WEB: Origin permitido, token ligado ao contexto CSRF; resposta no-store. CORS só origem web
        configurada.'
      parameters: []
      responses:
        '200':
          description: Obter token CSRF para cliente web
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
    post:
      operationId: getCsrfToken
      summary: Obter proteção CSRF vinculada ao refresh web
      tags: [auth]
      security:
      - refreshCookie: []
      x-permission: Origin permitido e cookie refresh obrigatório
      description: HMAC do refresh com segredo de servidor; renovar após cada rotação. Exige Origin exato. Não autentica nem renova sessão. Resposta no-store.
      responses:
        '200':
          description: Token CSRF para header X-CSRF-Token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token:
                    type: string
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'
  /auth/recovery:
    post:
      operationId: requestRecovery
      summary: Solicitar recuperação
      tags:
      - auth
      description: Resposta genérica independentemente de existência. 202 PENDENTE acusa recebimento da solicitação, não envio ou entrega. Conta apta enfileira UUID sem token em claro; falha SMTP posterior fica RECONCILIAR. Sem configuração, 503 para qualquer endereço.
      x-permission: Público; resposta genérica independentemente de existência
      responses:
        '202':
          description: Solicitar recuperação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
  /auth/recovery/complete:
    post:
      operationId: completeRecovery
      summary: Trocar senha e revogar sessões
      tags:
      - auth
      description: Token de recuperação válido e uso único
      x-permission: Token de recuperação válido e uso único
      responses:
        '200':
          description: Trocar senha e revogar sessões
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
  /me:
    get:
      operationId: getMe
      summary: Consultar conta própria
      tags:
      - me
      description: Conta autenticada
      x-permission: Conta autenticada
      responses:
        '200':
          description: Consultar conta própria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            ETag:
              schema:
                type: string
              description: Versão entre aspas para If-Match.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /me/patient:
    post:
      operationId: createPatient
      summary: Criar perfil de paciente próprio
      tags:
      - me
      description: Conta autenticada; identidade ainda pendente
      x-permission: Conta autenticada; identidade ainda pendente
      responses:
        '201':
          description: Criar perfil de paciente próprio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          headers:
            ETag:
              schema:
                type: string
              description: Versão entre aspas para If-Match.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
    get:
      operationId: getPatient
      summary: Consultar perfil de paciente próprio
      tags:
      - me
      description: Paciente titular
      x-permission: Paciente titular
      responses:
        '200':
          description: Consultar perfil de paciente próprio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
          headers:
            ETag:
              schema:
                type: string
              description: Versão entre aspas para If-Match.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
    put:
      operationId: updatePatient
      summary: Atualizar o perfil de paciente próprio
      tags:
      - me
      description: Somente titular. Alterar CPF ou nascimento mantém a identidade PENDENTE; não concede elegibilidade.
      x-permission: Paciente titular
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInput'
      responses:
        '200':
          description: Perfil atualizado
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
  /patients/{patientId}:
    get:
      operationId: getAccessiblePatient
      summary: Consultar perfil mínimo próprio ou concedido
      tags:
      - patients
      description: Titular ou familiar com concessão vigente para o escopo informado. A concessão é consultada a cada chamada; terceiro recebe 404.
      x-permission: Titular ou familiar com escopo vigente
      parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: scope
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FamilyScope'
        description: Obrigatório para familiar; o titular pode omitir.
      responses:
        '200':
          description: Perfil mínimo autorizado
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /me/privacy-requests:
    post:
      operationId: requestPrivacy
      summary: Registrar solicitação do titular
      tags:
      - me
      description: Conta autenticada; demanda encaminhada para processo auditado. Prazo e tratamento dependem de
        política validada. Não promete exclusão imediata de obrigação legal.
      x-permission: Conta autenticada; demanda encaminhada para processo auditado
      responses:
        '202':
          description: Registrar solicitação do titular
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyRequestInput'
  /patients/{patientId}/grants:
    post:
      operationId: grantFamily
      summary: Conceder representação
      tags:
      - patients
      description: Paciente adulto titular reautentica com senha e confirma invitationId ACEITO não expirado. Destinatário
        e escopos derivam do convite; scopes deve coincidir e expiresAt deve ficar no limite configurado. Identidade
        do perfil permanece independente e pode estar PENDENTE. Consumo e concessão são atômicos. Aceite sozinho não concede acesso.
      x-permission: Somente paciente titular reautenticado
      responses:
        '201':
          description: Conceder representação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
          headers:
            ETag:
              schema:
                type: string
              description: Versão entre aspas para If-Match.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
    get:
      operationId: listGrants
      summary: Listar representações
      tags:
      - patients
      description: Paciente titular
      x-permission: Paciente titular
      responses:
        '200':
          description: Listar representações
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: patientId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
  /patients/{patientId}/grants/{grantId}:
    delete:
      operationId: revokeGrant
      summary: Revogar representação
      tags:
      - patients
      description: Somente paciente titular; grant deve pertencer ao paciente. Revoga ações e assinaturas vinculadas;
        idempotência reautoriza antes de responder.
      x-permission: Somente paciente titular; grant deve pertencer ao paciente
      responses:
        '204':
          description: Revogar representação
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
