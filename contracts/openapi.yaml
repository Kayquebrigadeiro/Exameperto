        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeInput'
  /auth/recovery:
    post:
      operationId: requestRecovery
      summary: Solicitar recuperação
      tags:
      - auth
      description: Público; resposta genérica independentemente de existência
      x-permission: Público; resposta genérica independentemente de existência
      responses:
        '202':
          description: Solicitar recuperação
          content:
