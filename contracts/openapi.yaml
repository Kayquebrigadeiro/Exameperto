components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sessão revogável, emissor/audiência/assinatura/expiração validados. Nenhum privilégio inferido
        de cadastro.
    paymentSignature:
      type: apiKey
      in: header
      name: X-Event-Signature
      description: 'Placeholder técnico do adaptador: cabeçalho sozinho não autentica. Algoritmo, janela e headers
        finais precisam seguir o provedor selecionado; endpoint desabilitado até isso.'
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh
      description: Refresh rotativo da sessão WEB, sempre acompanhado de CSRF/Origin. MOBILE envia refresh no corpo.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: Única por ator/operação. Mesmo corpo retorna resultado original após reautorização; corpo diferente
        ou em andamento retorna 409. Chaves financeiras de negócio não expiram.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: ETag da versão do recurso alvo (pedido para seus comandos, orçamento para seu aceite). Ausente
        428, versão antiga 412.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Obrigatório em requisições WEB com cookie, além de Origin permitido; omitido em MOBILE sem cookie.
        Falha 403.
  schemas:
    Money:
      type: string
      pattern: ^(0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: BRL exato, até 999999999999.99. Não usar ponto flutuante.
    Version:
      type: integer
      format: int64
      minimum: 0
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
        retryable:
          type: boolean
      required:
      - code
      - message
      - correlationId
      - retryable
      description: Sem dados pessoais, stack trace ou existência de recurso alheio. code é estável; message é segura
        para exibição.
    Accepted:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDENTE
          - EM_PROCESSAMENTO
          - CONCLUIDA
      required:
      - id
      - status
    Register:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 160
      required:
      - email
      - password
      - name
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        client:
          type: string
          enum:
          - WEB
          - MOBILE
      required:
      - email
      - password
      - client
    Tokens:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
