      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDENTE
          - ACEITO
          - CONFIRMADO
          - REVOGADO
          - EXPIRADO
        scopes:
          type: array
          items:
            type: string
            enum:
            - PEDIDOS
            - BENEFICIOS
            - RASTREAMENTO
            - RECEBIMENTO
          uniqueItems: true
          minItems: 1
        expiresAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'
      required:
      - id
      - patientId
      - status
      - scopes
      - expiresAt
      - version
      description: Visão mínima privada. Não retorna segredo nem enumera contas.
    AcceptInvitation:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          writeOnly: true
      required:
      - token
      description: Token em corpo, sem logs/URL; hash de uso único. Conta autenticada com e-mail verificado igual
        ao destinatário; reuso conflitante recusado.
    Verification:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - IDADE
          - DEFICIENCIA
          - RENDA
        validUntil:
          type: string
          format: date-time
        revoked:
          type: boolean
        policyId:
          type: string
          format: uuid
      required:
      - id
      - type
      - validUntil
      - revoked
      - policyId
      description: Referência mínima; origem privada e analista auditados no servidor. Não atesta verificação oficial.
    VerificationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Verification'
        nextCursor:
          type: string
          nullable: true
      required:
      - items
      - nextCursor
    CancellationTerms:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        beforePickup:
          type: string
        afterPickup:
          type: string
        returnCoverage:
          type: string
      required:
      - id
      - number
      - beforePickup
      - afterPickup
      - returnCoverage
      description: Somente cláusulas validadas, sem dados de terceiros; não existem valores/multas aprovados nesta
        etapa.
    RemunerationAssessment:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        phase:
          type: string
          enum:
          - ANTES_RETIRADA
          - DEPOIS_RETIRADA
        status:
          type: string
          enum:
          - PENDENTE
          - CONCLUIDA
        amountDue:
          type: string
          nullable: true
          pattern: ^\d+\.\d{2}$
        version:
          $ref: '#/components/schemas/Version'
      required:
      - id
      - orderId
      - policyId
      - phase
      - status
      - amountDue
      - version
      description: Valor null enquanto pendente, não zero presumido. Valor devido não comprova repasse; leituras
        de parcelas financeiras seguem permissões próprias.
    AssessmentReview:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          maxLength: 50
        evidenceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
      - reasonCode
      - evidenceIds
      description: AO atribuído; servidor apura por política aceita e evidências autorizadas de serviço/deslocamento.
        GPS isolado insuficiente. Sem critérios/cobertura validados, 422; sem provedor, 503. Não aceita valor livre
        ou multas inventadas.
  responses:
    Error400:
      description: Requisição inválida / cursor inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Autenticação ausente, expirada ou revogada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Ação negada, CSRF ou escopo insuficiente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso inexistente ou não visível ao ator.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Conflito de estado, saldo insuficiente, duplicidade ou idempotência incompatível.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error412:
      description: Versão If-Match obsoleta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Arquivo ou corpo excede limite.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: Tipo de conteúdo não aceito.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Regra não satisfeita, evidência inválida, política indefinida ou GPS antigo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error428:
      description: If-Match obrigatório ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Limite de tentativas/requisições excedido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Segundos até nova tentativa, quando conhecidos.
    Error503:
      description: Integração ou configuração operacional indisponível; nunca resposta fictícia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Segundos até nova tentativa, quando conhecidos.
