          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '412':
          $ref: '#/components/responses/Error412'
        '428':
          $ref: '#/components/responses/Error428'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentReview'
  /me/mfa:
    get:
      operationId: getOwnMfaStatus
      summary: Consultar MFA da sessão privilegiada
      x-permission: Conta autenticada; próprio fator
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Estado sem segredo, content: {application/json: {schema: {$ref: '#/components/schemas/MfaStatus'}}}}
        '401': {$ref: '#/components/responses/Error401'}
  /me/mfa/totp/enrollment:
    post:
      operationId: enrollOwnTotp
      summary: Iniciar configuração TOTP
      description: Exige capacidade privilegiada nominal e reautenticação por senha. O segredo é retornado uma vez; nova configuração invalida elevações anteriores. Não cria papel nem conta privilegiada.
      x-permission: Capacidade privilegiada nominal implementada (nesta fatia, AO); própria conta; senha atual
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaPassword'}}}}
      responses:
        '200': {description: Segredo pendente e URI de provisionamento, content: {application/json: {schema: {$ref: '#/components/schemas/MfaEnrollment'}}}}
        '401': {$ref: '#/components/responses/Error401'}
        '403': {$ref: '#/components/responses/Error403'}
  /me/mfa/totp/confirmation:
    post:
      operationId: confirmOwnTotp
      summary: Confirmar fator TOTP e elevar a sessão
      description: Código de uso único por passo, tolerância de um passo e limite de tentativas. Elevação curta fica vinculada à sessão no servidor.
      x-permission: Capacidade privilegiada nominal implementada (nesta fatia, AO); próprio fator
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaCode'}}}}
      responses:
        '200': {description: Fator confirmado, content: {application/json: {schema: {$ref: '#/components/schemas/MfaStatus'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '429': {$ref: '#/components/responses/Error429'}
  /me/mfa/verification:
    post:
      operationId: verifyOwnTotp
      summary: Elevar sessão com TOTP
      x-permission: Capacidade privilegiada nominal implementada (nesta fatia, AO); próprio fator confirmado
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MfaCode'}}}}
      responses:
        '200': {description: Sessão elevada, content: {application/json: {schema: {$ref: '#/components/schemas/MfaStatus'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '429': {$ref: '#/components/responses/Error429'}
  /me/deliverer:
    post:
      operationId: createDelivererProfile
      summary: Criar cadastro de entregador
      description: Cadastro básico persistido como RASCUNHO; não habilita entregas nem aprova identidade profissional.
      x-permission: Conta autenticada
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DelivererInput'}}}
      responses:
        '201': {description: Cadastro criado, content: {application/json: {schema: {$ref: '#/components/schemas/Deliverer'}}}}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '409': {$ref: '#/components/responses/Error409'}
    put:
      operationId: updateDelivererProfile
      summary: Atualizar cadastro de entregador
      description: Atualização versionada; qualquer alteração volta o cadastro para RASCUNHO.
      x-permission: Conta autenticada; versão obrigatória
      security: [{bearerAuth: []}]
      parameters: [{in: query, name: version, required: true, schema: {type: integer, minimum: 0}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DelivererInput'}}}}
      responses:
        '200': {description: Cadastro atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Deliverer'}}}}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '412': {$ref: '#/components/responses/Error412'}
    get:
      operationId: getOwnDeliverer
      summary: Consultar cadastro do entregador
      x-permission: Conta autenticada; próprio cadastro
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Cadastro, content: {application/json: {schema: {$ref: '#/components/schemas/Deliverer'}}}}
        '404': {$ref: '#/components/responses/Error404'}
  /me/deliverer/documents:
    post:
      operationId: uploadDelivererDocument
      summary: Enviar comprovação privada
      description: Multipart limitado a 10 MiB; tipo real PDF/JPEG/PNG validado; objeto recebe nome gerado e entra em QUARENTENA.
      x-permission: Conta autenticada; próprio entregador
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [category, file], properties: {category: {type: string, enum: [IDENTIDADE, HABILITACAO, VEICULO, FOTO_OPERACIONAL]}, file: {type: string, format: binary}}}
      responses:
        '201': {description: Documento em quarentena, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '422': {$ref: '#/components/responses/Error422'}
    get:
      operationId: listOwnDelivererDocuments
      summary: Consultar histórico mínimo de documentos
      x-permission: Conta autenticada; próprio entregador
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Histórico, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Document'}}}}}
  /documents/{id}/download:
    get:
      operationId: downloadApprovedDocument
      summary: Baixar documento aprovado por proxy
      description: Somente o proprietário autorizado; inspeção aprovada obrigatória; resposta no-store e nunca URL direta do objeto.
      x-permission: Conta autenticada; proprietário e documento aprovado
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Conteúdo aprovado, headers: {Cache-Control: {schema: {type: string, enum: [no-store]}}}, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/Error404'}
  /analyst/reviews:
    get:
      operationId: listAssignedDelivererReviews
      summary: Listar fila de revisão
      description: Metadados mínimos para analista com papel atribuído; documentos permanecem atrás de proxy e reautorização.
      x-permission: ANALISTA_OPERACIONAL atribuído
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Fila, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Review'}}}}}
        '403': {$ref: '#/components/responses/Error403'}
  /analyst/reviews/{id}/assign:
    post:
      operationId: assignDelivererReview
      summary: Atribuir revisão
      description: Exige AO nominal, sessão elevada por MFA e impede revisão do próprio cadastro. O provisionamento do papel permanece fora da API; não há conta fictícia ou promoção pelo cliente.
      x-permission: ANALISTA_OPERACIONAL + MFA
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Revisão atribuída ao AO autenticado, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /analyst/reviews/{id}/decision:
    post:
      operationId: decideDelivererReview
      summary: Decidir revisão profissional
      description: Mesmo com MFA e inspeção estrutural concluídos, permanece bloqueado sem critérios profissionais publicados e responsável real. A inspeção do arquivo não autentica o documento.
      x-permission: ANALISTA_OPERACIONAL atribuído + MFA + critérios publicados
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewDecision'}}}}
      responses:
        '403': {$ref: '#/components/responses/Error403'}
        '422': {$ref: '#/components/responses/Error422'}
  /analyst/reviews/{id}/inspection:
    post:
      operationId: inspectDelivererFileSafety
      summary: Executar inspeção estrutural local do arquivo
      description: AO nominal atribuído com MFA. Verifica estrutura mínima e bloqueia conteúdo ativo conhecido; não comprova autenticidade documental, habilitação atual nem aprovação profissional.
      x-permission: ANALISTA_OPERACIONAL atribuído + MFA
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Inspeção registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
  /me/vehicle-links/{id}:
    get:
      operationId: getOwnVehicleLink
