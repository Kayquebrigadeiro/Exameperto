      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Vínculo, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleLink'}}}}
        '401': {$ref: '#/components/responses/Error401'}
        '404': {$ref: '#/components/responses/Error404'}
    put:
      operationId: updateOwnVehicleLink
      summary: Alterar veículo e vínculo
      description: Atualização otimista por versão; altera o estado para pendente e invalida revisão anterior.
      x-permission: Entregador titular; próprio vínculo; versão obrigatória
      security: [{bearerAuth: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: query, name: version, required: true, schema: {type: integer, format: int64, minimum: 0}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleInput'}}}}
      responses:
        '200': {description: Vínculo atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleLink'}}}}
        '401': {$ref: '#/components/responses/Error401'}
        '404': {$ref: '#/components/responses/Error404'}
        '412': {$ref: '#/components/responses/Error412'}
  /me/vehicle-links/{id}/documents:
    post:
      operationId: uploadVehicleEvidence
      summary: Enviar evidência privada do vínculo
      description: Multipart em quarentena; substituição preserva histórico e cria snapshot de revisão novo.
      x-permission: Entregador titular; próprio vínculo; versão obrigatória
      security: [{bearerAuth: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: query, name: version, required: true, schema: {type: integer, format: int64, minimum: 0}}
      - {in: query, name: purpose, required: true, schema: {type: string, enum: [CRLV, FOTO, USO_AUTORIZADO]}}
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}}}}
      responses:
        '200': {description: Vínculo com histórico de evidências, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleLink'}}}}
        '401': {$ref: '#/components/responses/Error401'}
        '404': {$ref: '#/components/responses/Error404'}
        '412': {$ref: '#/components/responses/Error412'}
        '413': {$ref: '#/components/responses/Error413'}
  /me/vehicle-links/{id}/documents/reuse:
    post:
      operationId: reuseOwnVehicleEvidence
      summary: Reutilizar documento privado próprio
      description: Reutiliza referência de documento da mesma conta; documento de outra conta não é aceito.
      x-permission: Entregador titular; documento próprio; versão obrigatória
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleDocumentReuse'}}}}
      responses:
        '200': {description: Vínculo atualizado, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleLink'}}}}
        '401': {$ref: '#/components/responses/Error401'}
        '404': {$ref: '#/components/responses/Error404'}
        '412': {$ref: '#/components/responses/Error412'}
  /analyst/vehicle-reviews:
    get:
      operationId: listVehicleReviews
      summary: Listar revisões de vínculo
      x-permission: ANALISTA_OPERACIONAL
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Fila, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/VehicleReview'}}}}}
        '403': {$ref: '#/components/responses/Error403'}
  /analyst/vehicle-reviews/{id}/assign:
    post:
      operationId: assignVehicleReview
      summary: Atribuir revisão de veículo
      description: Exige MFA e impede autoanálise.
      x-permission: ANALISTA_OPERACIONAL + MFA
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Revisão atribuída, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleReview'}}}}, '403': {$ref: '#/components/responses/Error403'}, '409': {$ref: '#/components/responses/Error409'}}
  /analyst/vehicle-reviews/{id}/documents/{documentId}/inspection:
    post:
      operationId: inspectVehicleEvidence
      summary: Inspecionar estrutura da evidência
      description: Não verifica autenticidade e não é varredura antimalware.
      x-permission: ANALISTA_OPERACIONAL atribuído + MFA
      security: [{bearerAuth: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Inspeção registrada, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleReview'}}}}, '403': {$ref: '#/components/responses/Error403'}, '404': {$ref: '#/components/responses/Error404'}, '409': {$ref: '#/components/responses/Error409'}}
  /analyst/vehicle-reviews/{id}/documents/{documentId}/download:
    get:
      operationId: downloadAssignedVehicleEvidence
      summary: Baixar evidência autorizada da revisão
      x-permission: ANALISTA_OPERACIONAL atribuído + MFA; snapshot corrente
      security: [{bearerAuth: []}]
      parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Conteúdo privado, content: {application/octet-stream: {schema: {type: string, format: binary}}}}, '403': {$ref: '#/components/responses/Error403'}, '404': {$ref: '#/components/responses/Error404'}, '409': {$ref: '#/components/responses/Error409'}}
  /analyst/vehicle-reviews/{id}/decision:
    post:
      operationId: decideVehicleReview
      summary: Solicitar decisão profissional de vínculo
      description: Continua bloqueada com POLICY_UNDEFINED até critérios, responsáveis e integrações reais existirem.
      x-permission: ANALISTA_OPERACIONAL atribuído + MFA + critérios profissionais publicados
      security: [{bearerAuth: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewDecision'}}}}
      responses: {'403': {$ref: '#/components/responses/Error403'}, '404': {$ref: '#/components/responses/Error404'}, '409': {$ref: '#/components/responses/Error409'}, '422': {$ref: '#/components/responses/Error422'}}
  /benefit-requests:
    post:
      operationId: createBenefitRequestV7
      summary: Criar solicitação de benefício
      tags: [benefits]
      description: Paciente titular ou familiar com escopo BENEFICIOS vigente; política ATIVA versionada é capturada por snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BenefitRequestInputV7'}
      responses:
        '201': {description: Solicitação criada, content: {application/json: {schema: {$ref: '#/components/schemas/BenefitRequestV7'}}}}
        '401': {$ref: '#/components/responses/Error401'}
    get:
      operationId: listBenefitRequestsV7
      summary: Listar solicitações acessíveis
      tags: [benefits]
      responses:
        '200': {description: Solicitações, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BenefitRequestV7'}}}}}
        '401': {$ref: '#/components/responses/Error401'}
  /me/financial-documents:
    post:
      operationId: uploadFinancialEvidence
      summary: Anexar evidência privada de aporte
      tags: [funding]
      description: Conta autenticada; o arquivo permanece privado e em quarentena. Upload não comprova transferência nem aumenta saldo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {description: Documento privado em quarentena, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '413': {$ref: '#/components/responses/Error413'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '422': {$ref: '#/components/responses/Error422'}
  /benefit-requests/{requestId}:
    parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getBenefitRequestV7
      summary: Consultar solicitação
      tags: [benefits]
      responses:
        '200': {description: Solicitação e histórico, content: {application/json: {schema: {$ref: '#/components/schemas/BenefitRequestV7'}}}}
        '404': {$ref: '#/components/responses/Error404'}
  /benefit-requests/{requestId}/appeal:
    post:
      operationId: appealBenefitRequestV7
      summary: Recorrer de decisão
      tags: [benefits]
      parameters: [{name: requestId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BenefitAppealInputV7'}}}}
      responses:
        '200': {description: Recurso criado, content: {application/json: {schema: {$ref: '#/components/schemas/BenefitRequestV7'}}}}
        '412': {description: Versão obsoleta, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/Error422'}
  /analyst/benefit-reviews:
    get:
      operationId: listBenefitReviewsV7
      summary: Fila de revisões atribuíveis
      tags: [benefits]
      description: Membro ativo da instituição; decisão/inspeção exigem MFA.
      responses:
        '200': {description: Fila, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BenefitReviewV7'}}}}}
  /analyst/benefit-reviews/{reviewId}/assign:
    post:
      operationId: assignBenefitReviewV7
      summary: Atribuir revisão
      tags: [benefits]
      parameters: [{name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Revisão atribuída, content: {application/json: {schema: {$ref: '#/components/schemas/BenefitReviewV7'}}}}
        '403': {$ref: '#/components/responses/Error403'}
  /analyst/benefit-reviews/{reviewId}/decision:
    post:
      operationId: decideBenefitReviewV7
      summary: Decidir revisão
      tags: [benefits]
      parameters: [{name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BenefitDecisionInputV7'}}}}
      responses:
        '200': {description: Decisão humana registrada, content: {application/json: {schema: {$ref: '#/components/schemas/BenefitRequestV7'}}}}
        '422': {$ref: '#/components/responses/Error422'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sessão revogável, emissor/audiência/assinatura/expiração validados. Nenhum privilégio inferido
        de cadastro.
    paymentSignature:
      type: apiKey
      in: header
      name: X-Event-Signature
      description: 'Placeholder técnico do adaptador: cabeçalho sozinho não autentica. Algoritmo, janela e headers
        finais precisam seguir o provedor selecionado; endpoint desabilitado até isso.'
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh
      description: Refresh rotativo da sessão WEB, sempre acompanhado de CSRF/Origin. MOBILE envia refresh no corpo.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: Única por ator/operação. Mesmo corpo retorna resultado original após reautorização; corpo diferente
        ou em andamento retorna 409. Chaves financeiras de negócio não expiram.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: ETag da versão do recurso alvo (pedido para seus comandos, orçamento para seu aceite). Ausente
        428, versão antiga 412.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Csrf:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Obrigatório em requisições WEB com cookie, além de Origin permitido; omitido em MOBILE sem cookie.
        Falha 403.
  schemas:
    BenefitRequestInputV7:
      type: object
      required: [patientId, policyId, dimensions]
      properties:
        patientId: {type: string, format: uuid}
        policyId: {type: string, format: uuid}
        dimensions: {type: array, minItems: 1, items: {type: string, enum: [IDADE, DEFICIENCIA, RENDA]}}
    BenefitAppealInputV7:
      type: object
      required: [reason, requestVersion]
      properties:
        reason: {type: string, minLength: 1}
        requestVersion: {type: integer, minimum: 0}
    BenefitDecisionInputV7:
      type: object
      required: [decision, percentage, reason]
      properties:
        decision: {type: string, enum: [APROVADA, REJEITADA]}
        percentage: {type: number, minimum: 0, maximum: 100}
        reason: {type: string, minLength: 1}
    BenefitEvidenceV7:
      type: object
      required: [id, purpose, state, current]
      properties:
        id: {type: string, format: uuid}
